name: RepairProof production rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full 40-character SHA of a release previously deployed to production
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  rollback:
    name: Roll back application containers (keep database schema)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Verify target is a successful main release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.image_tag }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Enter a full lowercase commit SHA" >&2; exit 2; }
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          gh run list --workflow ci-cd.yml --commit "$TARGET_SHA" --branch main --json conclusion,event \
            --jq 'any(.[]; .conclusion == "success" and .event == "push")' | grep -qx true

      - name: Configure SSH and restore previously deployed images
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_STACK_NAME: repairproof-production
          TARGET_SHA: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9/_-]+$ ]]
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | ssh-add -
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          target="$DEPLOY_USER@$DEPLOY_HOST"
          release_dir="$DEPLOY_PATH/releases/rollback-$GITHUB_RUN_ID"
          ssh -o StrictHostKeyChecking=yes "$target" "mkdir -p '$release_dir'"
          scp -o StrictHostKeyChecking=yes docker/docker-compose.prod.yml scripts/deploy-compose.sh "$target:$release_dir/"
          ssh -o StrictHostKeyChecking=yes "$target" \
            "chmod 700 '$release_dir/deploy-compose.sh' && IMAGE_PREFIX='$IMAGE_PREFIX' DEPLOY_DIR='$DEPLOY_PATH' STACK_NAME='$DEPLOY_STACK_NAME' bash '$release_dir/deploy-compose.sh' '$TARGET_SHA' --skip-migrations"
