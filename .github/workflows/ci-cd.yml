name: RepairProof CI and CD

on:
  pull_request:
    branches: [development, staging, main]
  push:
    branches: [development, staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repairproof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Format, lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-project

      - name: Frontend formatting check
        run: pnpm --filter @repairproof/web run format:check

      - name: Backend formatting check
        run: pnpm --filter @repairproof/api run format:check

      - name: Backend lint
        run: pnpm --filter @repairproof/api run lint

      - name: Frontend lint
        run: pnpm --filter @repairproof/web run lint

      - name: Type check
        run: |
          pnpm --filter @repairproof/shared run typecheck
          pnpm --filter @repairproof/api run typecheck
          pnpm --filter @repairproof/web run typecheck

      - name: Backend unit tests
        run: pnpm --filter @repairproof/api exec jest --runInBand

      - name: Frontend unit tests
        run: pnpm --filter @repairproof/web run test

  database-integration:
    name: PostgreSQL migrations and API integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: repairproof_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d repairproof_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/repairproof_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/repairproof_ci?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/repairproof_ci?schema=public
      EVIDENCE_STORAGE_DISABLED: "true"
      REDIS_URL: ""
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-project
      - name: Generate Prisma client and apply migrations to a clean database
        run: |
          pnpm --filter @repairproof/api run db:generate
          pnpm --filter @repairproof/api run db:migrate:deploy
      - name: Run lifecycle and HTTP-to-PostgreSQL integration suites
        run: pnpm --filter @repairproof/api run test:integration

  browser:
    name: Chromium browser and responsive checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-project
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Start Vite
        run: |
          pnpm --filter @repairproof/web run dev -- --host 127.0.0.1 > /tmp/repairproof-vite.log 2>&1 &
          echo $! > /tmp/repairproof-vite.pid
      - name: Wait for Vite
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/repairproof-vite.log
          exit 1
      - name: Run Chromium browser suite
        env:
          REPAIRPROOF_WEB_URL: http://127.0.0.1:5173
        run: python -m pytest apps/web/tests/e2e -q
      - name: Stop Vite
        if: always()
        run: if [ -f /tmp/repairproof-vite.pid ]; then kill "$(cat /tmp/repairproof-vite.pid)" || true; fi

  invoice-ai:
    name: Invoice intelligence tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/invoice-intelligence/requirements-dev.txt
      - name: Install AI test dependencies
        run: python -m pip install -r services/ai/invoice-intelligence/requirements-dev.txt
      - name: Check AI service formatting
        run: python -m ruff format --check services/ai/invoice-intelligence/app services/ai/invoice-intelligence/tests
      - name: Lint AI service
        run: python -m ruff check --select E4,E7,E9,F services/ai/invoice-intelligence/app services/ai/invoice-intelligence/tests
      - name: Type check AI service
        run: python -m mypy --ignore-missing-imports services/ai/invoice-intelligence/app
      - name: Test OCR extraction and confidence handling
        run: python -m pytest services/ai/invoice-intelligence/tests -q

  dependency-security:
    name: Dependency security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-project
      - name: Audit production Node dependencies
        run: pnpm audit --prod --audit-level high
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit invoice AI Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r services/ai/invoice-intelligence/requirements.txt
      - name: Review introduced dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  container-build:
    name: Production container build verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: docker/Dockerfile.api
            target: runner
          - name: migration-runner
            file: docker/Dockerfile.api
            target: build
          - name: web
            file: docker/Dockerfile.web
            target: runner
          - name: invoice-ai
            file: services/ai/invoice-intelligence/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          tags: repairproof/${{ matrix.name }}:ci
          build-args: |
            VITE_API_URL=/api
            VITE_SUPABASE_URL=https://example.supabase.co
            VITE_SUPABASE_ANON_KEY=ci-public-anon-key
            VITE_APP_URL=https://example.invalid

  deploy:
    name: Deploy reviewed release
    runs-on: ubuntu-latest
    needs: [quality, database-integration, browser, invoice-ai, dependency-security, container-build]
    if: >-
      always() && needs.quality.result == 'success' && needs.database-integration.result == 'success' &&
      needs.browser.result == 'success' && needs.invoice-ai.result == 'success' &&
      needs.dependency-security.result == 'success' && needs.container-build.result == 'success' &&
      ((github.event_name == 'push' && (github.ref_name == 'development' || github.ref_name == 'staging')) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'production' || github.ref_name }}
    concurrency:
      group: repairproof-deploy-${{ github.event_name == 'workflow_dispatch' && 'production' || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Require merged PR approval for production release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          pull_number="$(gh api "repos/$GH_REPOSITORY/commits/$RELEASE_SHA/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null) | .number][0] // empty')"
          [[ -n "$pull_number" ]] || { echo "Production release must be associated with a merged PR into main" >&2; exit 1; }
          pull="$(gh api "repos/$GH_REPOSITORY/pulls/$pull_number")"
          author="$(printf '%s' "$pull" | jq -r '.user.login')"
          latest_commit_sha="$(printf '%s' "$pull" | jq -r '.head.sha')"
          reviews="$(gh api --paginate --slurp "repos/$GH_REPOSITORY/pulls/$pull_number/reviews?per_page=100")"
          independent_approvals="$(printf '%s' "$reviews" | jq --arg author "$author" --arg head "$latest_commit_sha" \
            '[.[][] | select(.submitted_at != null and .commit_id == $head)] | sort_by(.submitted_at) | group_by(.user.login) | map(last) | map(select(.state == "APPROVED" and .user.login != $author)) | length')"
          [[ "$independent_approvals" =~ ^[0-9]+$ && "$independent_approvals" -ge 1 ]] || {
            echo "Production release requires an approval from someone other than the PR author" >&2
            exit 1
          }
          echo "Verified merged PR #$pull_number with an independent approval"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set immutable release image names
        id: images
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.api
          target: runner
          push: true
          tags: ${{ steps.images.outputs.prefix }}/api:${{ github.sha }}

      - name: Build and publish migration runner image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.api
          target: build
          push: true
          tags: ${{ steps.images.outputs.prefix }}/migrate:${{ github.sha }}

      - name: Build and publish frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: ${{ steps.images.outputs.prefix }}/web:${{ github.sha }}
          build-args: |
            VITE_API_URL=/api
            VITE_SUPABASE_URL=${{ vars.SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
            VITE_APP_URL=${{ vars.PUBLIC_APP_URL }}

      - name: Build and publish invoice intelligence image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/ai/invoice-intelligence/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.prefix }}/invoice-ai:${{ github.sha }}

      - name: Configure SSH and deploy the immutable release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE_PREFIX: ${{ steps.images.outputs.prefix }}
          DEPLOY_STACK_NAME: repairproof-${{ github.event_name == 'workflow_dispatch' && 'production' || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9/_-]+$ ]]
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | ssh-add -
          target="$DEPLOY_USER@$DEPLOY_HOST"
          release_dir="$DEPLOY_PATH/releases/$GITHUB_SHA"
          ssh -o StrictHostKeyChecking=yes "$target" "mkdir -p '$release_dir'"
          scp -o StrictHostKeyChecking=yes docker/docker-compose.prod.yml scripts/deploy-compose.sh "$target:$release_dir/"
          ssh -o StrictHostKeyChecking=yes "$target" \
            "chmod 700 '$release_dir/deploy-compose.sh' && IMAGE_PREFIX='$IMAGE_PREFIX' DEPLOY_DIR='$DEPLOY_PATH' STACK_NAME='$DEPLOY_STACK_NAME' bash '$release_dir/deploy-compose.sh' '$GITHUB_SHA'"
