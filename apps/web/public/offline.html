<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>Offline · RepairProof</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #15264e; background: #f7f8fa; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 34rem); padding: 32px; border: 1px solid #d7dce5; border-radius: 16px; background: #fff; }
      h1 { margin: 0 0 12px; font-size: clamp(1.5rem, 5vw, 2rem); }
      p { line-height: 1.6; color: #475569; }
      button { min-height: 48px; padding: 0 18px; border: 0; border-radius: 8px; background: #3457e8; color: white; font: inherit; font-weight: 650; cursor: pointer; }
      button:focus-visible { outline: 3px solid #15264e; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>RepairProof could not reach the network. Locally saved technician drafts remain on this device. They have not been submitted or confirmed by the server.</p>
      <p>Customer approvals, repair status changes, uploads, and repair completion require a server connection.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
