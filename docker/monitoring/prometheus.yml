global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/repairproof-alert-rules.yml

scrape_configs:
  - job_name: repairproof-api
    metrics_path: /health/metrics
    scrape_interval: 30s
    static_configs:
      - targets: [api:3001]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/repairproof-metrics-token
